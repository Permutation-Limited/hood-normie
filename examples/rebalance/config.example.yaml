# Asset classification is global: every portfolio shares this symbol-to-class map.
assets:
  - symbol: VTI
    class: stocks
  - symbol: VXUS
    class: stocks
  - symbol: BND
    class: bonds
  - symbol: OLD
    class: legacy
# Each portfolio is rebalanced independently against its own accounts and targets.
portfolios:
  - name: taxable
    robinhood_account_numbers: [ACCOUNT_ONE]
    target_cash: -2000
    minimum_trade: 5
    classes:
      - name: stocks
        weight: 0.80
        target_amount: null
        ignore: false
      - name: bonds
        weight: 0.20
        target_amount: null
        ignore: false
      - name: legacy
        ignore: true
    external_accounts:
      - name: 401(k)
        cash: 500
        assets:
          - symbol: VTI
            quantity: 10
  - name: retirement
    robinhood_account_numbers: [ACCOUNT_TWO]
    minimum_trade: 5
    classes:
      - name: stocks
        weight: 0.60
      - name: bonds
        weight: 0.40
      # legacy is undeclared here, so it targets $0 in this portfolio. Declare it
      # with ignore: true instead to keep it out of the calculation entirely.
