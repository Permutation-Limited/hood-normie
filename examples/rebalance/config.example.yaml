# Asset classification is global: every portfolio shares this symbol-to-class map.
assets:
  - symbol: VTI
    class: stocks
  - symbol: VXUS
    class: stocks
  - symbol: BND
    class: bonds
  - symbol: OLD
    class: legacy
# Each portfolio is rebalanced independently against its own accounts and targets.
portfolios:
  - name: taxable
    target_cash: -2000
    minimum_trade: 5
    classes:
      - name: stocks
        weight: 0.80
        target_amount: null
        ignore: false
      - name: bonds
        weight: 0.20
        target_amount: null
        ignore: false
      - name: legacy
        ignore: true
